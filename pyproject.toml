[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wisprflow-re"
version = "0.1.0"
description = "Patch-free unofficial Python client for Wispr Flow"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "grpcio>=1.74,<2",
]

[project.optional-dependencies]
microphone = [
    "sounddevice>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["wisprflow"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
source = ["wisprflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.4",
]
